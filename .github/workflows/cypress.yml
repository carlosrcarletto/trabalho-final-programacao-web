name: Cypress E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # gravar o histórico na branch test-history
  checks: write

# Evita duas execuções gravando o histórico ao mesmo tempo
concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # O histórico só é gravado a partir da branch principal
      SAVE_HISTORY: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Publicar resultados no Checks
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: cypress/results/*.xml
          check_name: Resultados Cypress
          include_passed: true

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports
          retention-days: 14
          if-no-files-found: ignore

      # Quadro 🟢/🔴 por cenário no resumo da execução, com o histórico guardado na branch test-history
      - name: Quadro de histórico dos cenários
        if: always()
        run: |
          mkdir -p test-history
          if git fetch --depth=1 origin test-history; then
            git show origin/test-history:history.json > test-history/history.json || rm -f test-history/history.json
          else
            echo "Primeira execução: ainda não há histórico salvo"
          fi
          node scripts/test-history.js cypress/results test-history/history.json >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar histórico dos cenários
        if: always() && env.SAVE_HISTORY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: test-history
          publish_dir: test-history
          commit_message: "histórico da execução #${{ github.run_number }}"
