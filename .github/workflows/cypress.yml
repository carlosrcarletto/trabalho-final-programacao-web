name: Cypress E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Publicar resultados no Checks
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: cypress/results/*.xml
          check_name: Resultados Cypress
          include_passed: true

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports
          retention-days: 14
          if-no-files-found: ignore
